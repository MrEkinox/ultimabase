name: Set up repository
description: Install the pinned Node and Yarn toolchain with immutable registry archives.
inputs:
  cache:
    description: Restore and save the Yarn cache; a release job installs without it (D-156).
    default: 'true'
runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 24
        package-manager-cache: false
    - run: corepack enable
      shell: bash
    - if: inputs.cache == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .yarn/cache
        key: yarn-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('yarn.lock', '.yarnrc.yml') }}
    - run: yarn install --immutable
      shell: bash
