name: Set up repository
description: Install the pinned Node and Yarn toolchain with immutable registry archives.
inputs:
  cache:
    description: Restore and save the Yarn cache; a release job installs without it (D-156).
    default: 'true'
runs:
  using: composite
  steps:
    - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
      with:
        node-version: 24
        package-manager-cache: false
    - run: corepack enable
      shell: bash
    - if: inputs.cache == 'true'
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
      with:
        path: .yarn/cache
        key: yarn-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('yarn.lock', '.yarnrc.yml') }}
    - run: yarn install --immutable
      shell: bash
