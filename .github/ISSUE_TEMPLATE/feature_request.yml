name: Feature request
description: Propose a capability, a plugin need or an API improvement.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you are trying to build and what blocks you today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: The API or behavior you would like, ideally as a short code sample.
  - type: dropdown
    id: scope
    attributes:
      label: Where should it live?
      options:
        - A plugin (official or community)
        - Core (a generic extension point plugins need)
        - Documentation or examples
        - Not sure
