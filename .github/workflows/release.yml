name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  # Version pull requests and publications must never race.
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Update release pull request
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Create or update version pull request
        uses: changesets/action@v1
        with:
          version: yarn changeset version
          title: Release packages
          commit: 'chore(release): version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    name: Publish packages
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: npm
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Enable Corepack
        run: corepack enable

      - name: Install an OIDC-capable npm CLI
        # Trusted publishing requires npm 11.5.1 or newer.
        run: npm install --global npm@latest

      - name: Install dependencies
        run: yarn install --immutable

      - name: Install Chromium for browser boundary tests
        run: yarn playwright install --with-deps chromium

      - name: Publish validated packages
        uses: changesets/action@v1
        with:
          publish: yarn release:publish
        env:
          # OIDC is preferred; this secret is only needed to bootstrap new packages.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
