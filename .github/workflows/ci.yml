name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  # Keep only the latest run for a workflow and Git reference.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Enable Corepack
        run: corepack enable

      - name: Cache Yarn packages
        uses: actions/cache@v5
        with:
          # The repository-local cache contains immutable registry archives only.
          path: .yarn/cache
          key: yarn-${{ runner.os }}-${{ hashFiles('yarn.lock') }}

      - name: Install dependencies
        run: yarn install --immutable

      - name: Check formatting
        run: yarn format:check

      - name: Lint
        run: yarn lint

      - name: Typecheck
        run: yarn typecheck

      - name: Run unit and type tests
        run: yarn test

      - name: Verify Docker access
        # Testcontainers will use the same Docker daemon in future integration tests.
        run: docker version

      - name: Build and run E2E tests
        run: yarn test:e2e
