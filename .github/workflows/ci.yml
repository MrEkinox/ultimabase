name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  # Keep only the latest run for a workflow and Git reference.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-24.04
    # Type-aware linting, exhaustive coverage, and Docker-backed E2E tests run
    # sequentially so the full quality gate needs more than fifteen minutes.
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Enable Corepack
        run: corepack enable

      - name: Cache Yarn packages
        uses: actions/cache@v5
        with:
          # The repository-local cache contains immutable registry archives only.
          path: .yarn/cache
          key: yarn-${{ runner.os }}-${{ hashFiles('yarn.lock') }}

      - name: Install dependencies
        run: yarn install --immutable

      - name: Install Chromium for browser boundary tests
        run: yarn playwright install --with-deps chromium

      - name: Check formatting
        run: yarn format:check

      - name: Check issue metadata
        run: yarn check:issues

      - name: Typecheck
        # Project references emit the declarations required by typed E2E linting.
        run: yarn typecheck

      - name: Validate public documentation
        run: yarn website:validate

      - name: Lint
        run: yarn lint
        env:
          # Type-aware ESLint loads every workspace program and now exceeds the
          # previous 4 GiB heap boundary on the hosted runner.
          NODE_OPTIONS: --max-old-space-size=6144

      - name: Run unit and type tests with coverage
        run: yarn test:coverage

      - name: Verify Docker access
        # Testcontainers will use the same Docker daemon in future integration tests.
        run: docker version

      - name: Build and run E2E package tests
        run: yarn test:e2e
